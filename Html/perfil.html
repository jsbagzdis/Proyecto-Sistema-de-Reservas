<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Planeta Deporte</title>
    <link rel="stylesheet" href="../Css/perfil.css"> 
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">PLANETA DEPORTE</div>
        <nav class="sidebar-nav">
            <a href="menu.html" class="nav-item">Inicio</a>
            <a href="reserva.html" class="nav-item">Reservas</a>
            <a href="canchas.html" class="nav-item">Canchas</a>
            <a href="perfil.html" class="nav-item active">Perfil</a> 
            <a href="login.html" class="nav-item" style="color: #ff4d4d; margin-top: auto;">Cerrar Sesión</a>
        </nav>


        <div class="sidebar-contacto">
            <h4>Contacto</h4>
            <p>contacto@planetadeporte.com</p>
            <p>📞 +54 9 3571 320679</p>
            <p>📍 Río Tercero, Córdoba</p>
        </div>
    </aside>
   

    <!--Desplazamo el contenido a la derecha de la sidebar -->
    <div class="main-wrapper">
        <div class="perfil-container">
            <h2>Mi Perfil</h2>
            
            <div class="tarjeta-perfil">
                <div class="form-group">
                    <label for="perfilNombre">Nombre:</label>
                    <input type="text" id="perfilNombre" placeholder="Tu nombre">
                </div>
                
                <div class="form-group">
                    <label for="perfilUsuario">Nombre de Usuario:</label>
                    <input type="text" id="perfilUsuario" placeholder="Tu usuario">
                </div>
                
                <div class="form-group">
                    <label for="perfilCorreo">Correo Electrónico:</label>
                    <input type="email" id="perfilCorreo" placeholder="Tu correo">
                </div>
                
                <div class="form-group">
                    <label for="perfilTelefono">Teléfono:</label>
                    <input type="text" id="perfilTelefono" placeholder="Ingresa tu teléfono aquí">
                </div>
            </div>

            <button onclick="guardarCambios()" class="btn-guardar">Guardar Cambios</button>
            <button onclick="cerrarSesion()" class="btn-cerrar">Cerrar Sesión</button>
        </div>
    </div>

    <script src="../JavaScript/perfil.js"></script> 
</body>
</html>
