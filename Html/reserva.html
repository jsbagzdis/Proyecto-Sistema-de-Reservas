<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/reserva.css">
    <title>Sistema de Reservas - Planeta Deporte</title>
</head>
<body>

    <!-- Sidebar Lateral Izquierda -->
    <aside class="sidebar">
      <div class="sidebar-logo">PLANETA DEPORTE</div>
      <nav class="sidebar-nav">
        <a href="menu.html" class="nav-item">Inicio</a>
        <a href="reserva.html" class="nav-item active">Reservas</a>
        <a href="mis-turnos.html" class="nav-item">Mis Turnos</a>
        <a href="canchas.html" id="nav-canchas" class="nav-item" style="display: none;">Canchas</a>
        <a href="perfil.html" class="nav-item">Perfil</a>
        <a href="login.html" class="nav-item" style="color: #ff4d4d; margin-top: auto;">Cerrar Sesión</a>
      </nav>


        <div class="sidebar-contacto">
            <h4>Contacto</h4>
            <p>contacto@planetadeporte.com</p>
            <p>📞 +54 9 3571 320679</p>
            <p>📍 Río Tercero, Córdoba</p>
        </div>
    </aside>

    <!-- Contenido Principal Desplazado -->
    <div class="main-wrapper">
        
        <header class="encabezado">
            <h1>BUSCAR TURNOS</h1>
            <p>Elegí tu deporte, la fecha y la duración para ver los horarios disponibles</p>
        </header>

        <div class="todo">
            <form id="formularioForm">
                <label for="deporteSelect">Seleccioná el Deporte</label>
                <select id="deporteSelect" required>
                    <option value="" disabled selected>Seleccione un deporte...</option>
                    <option value="Fútbol">Fútbol</option>
                    <option value="Básquetbol">Básquetbol</option>
                    <option value="Pádel">Pádel</option>
                    <option value="Tenis">Tenis</option>
                </select>

                <label for="fecha">Fecha del Partido</label>
                <input type="date" id="fecha" required>

                <label for="duracion">Duración del Turno</label>
                <select id="duracion" required>
                    <option value="" disabled selected>Seleccione la duración...</option>
                    <option value="60">1 hs</option>
                    <option value="90">1:30 hs</option>
                    <option value="120">2 hs</option>
                </select>

                <button type="button" id="btnEnviar">Buscar Horarios Disponibles</button>
                
                <p id="mensaje"></p>
            </form>

            <div class="ListaReservas" id="contenedorTurnos">
                <h2>Turnos Disponibles</h2>
                <div id="listaHorariosLibres"></div>
            </div>
        </div>

    </div>

    <script src="../JavaScript/sidebar.js"></script>
    <script src="../JavaScript/reserva.js"></script>
</body>
</html>
